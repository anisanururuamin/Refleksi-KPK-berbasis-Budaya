<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematika di Sekitar Kita — Refleksi KPK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#FAF5EA;--surface:#FFFDF8;--surface2:#F3EBDA;--ink:#3B3128;--muted:#7A6B5C;--line:#E6DAC4;
  --sage:#9CAF88;--sage-d:#5F7A52;--sage-l:#E4EBD9;--brown:#B89572;--terra:#C8704A;--terra-l:#F6DFD2;--amber:#D9A441;
  --shadow:0 6px 22px rgba(90,70,40,.10);--shadow-s:0 2px 8px rgba(90,70,40,.08);
  --head:'Fraunces',Georgia,'Times New Roman',serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1B16;--surface:#2A261F;--surface2:#332E25;--ink:#F2EADB;--muted:#BDB09B;--line:#4A4235;
    --sage:#8FA67B;--sage-d:#A9C095;--sage-l:#323B2A;--brown:#C9A883;--terra:#E08A64;--terra-l:#43302A;--amber:#E5B357;
    --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-s:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1B16;--surface:#2A261F;--surface2:#332E25;--ink:#F2EADB;--muted:#BDB09B;--line:#4A4235;
  --sage:#8FA67B;--sage-d:#A9C095;--sage-l:#323B2A;--brown:#C9A883;--terra:#E08A64;--terra-l:#43302A;--amber:#E5B357;
  --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-s:0 2px 8px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 40px}
.narrow{max-width:720px}
.eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.band{height:26px;border-radius:0 0 14px 14px;overflow:hidden;opacity:.5}
.band svg{display:block;width:100%;height:100%}

/* Buttons */
.btn{border:1.5px solid transparent;border-radius:999px;padding:11px 22px;font-weight:800;font-size:1rem;transition:transform .12s,box-shadow .12s,background .12s;display:inline-flex;align-items:center;gap:8px;justify-content:center;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--terra);color:#fff;box-shadow:0 4px 14px rgba(200,112,74,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sage{background:var(--sage-d);color:#fff}
:root[data-theme="dark"] .btn.sage{color:#1E1B16}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;border-color:var(--terra);color:var(--terra)}
.btn.big{padding:15px 32px;font-size:1.1rem}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.linkbtn{background:none;border:0;color:var(--sage-d);font-weight:800;padding:4px 0;font-size:.92rem}
.linkbtn:hover{text-decoration:underline}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;min-height:68vh;padding-top:12px}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.6rem);color:var(--ink);margin-bottom:8px}
.hero .lead{font-size:1.2rem;color:var(--muted);margin:12px 0 26px;max-width:30ch}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.tag{background:var(--sage-l);color:var(--sage-d);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.82rem}
.hero-art svg{width:100%;height:auto;max-width:460px;display:block;margin:0 auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:1px dashed var(--line)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.mode i{width:9px;height:9px;border-radius:50%;background:var(--brown);display:inline-block}
.mode.on i{background:var(--sage-d)}
.notice{background:var(--terra-l);color:var(--ink);border:1px solid var(--terra);border-radius:14px;padding:10px 14px;font-size:.92rem;margin:0 0 16px}

/* Steps */
.steps{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.steps span{display:inline-flex;gap:6px;align-items:center}
.steps b{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:inline-grid;place-items:center;font-size:.75rem}
.steps .on{color:var(--ink)}.steps .on b{background:var(--terra);color:#fff}
.steps .done b{background:var(--sage-d);color:#fff}
.steps em{width:18px;height:2px;background:var(--line);display:inline-block}

/* Cards / forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}
.field{margin-bottom:18px}
.field label,.lbl{display:block;font-weight:800;margin-bottom:6px}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--sage-d);box-shadow:0 0 0 3px var(--sage-l)}
textarea{min-height:92px;resize:vertical}
.err{color:var(--terra);font-weight:700;font-size:.9rem;margin-top:8px;min-height:1.2em}

/* Reflection page */
.rhead h1{font-size:clamp(1.5rem,3.6vw,2.1rem)}
.rhead p{margin:6px 0 0;color:var(--muted)}
.me{display:inline-flex;gap:8px;align-items:center;background:var(--sage-l);color:var(--sage-d);font-weight:800;border-radius:999px;padding:5px 14px;font-size:.9rem;margin-top:12px}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
.prog-row{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-d));border-radius:99px;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-s);padding:22px;margin-bottom:16px;transition:border-color .2s,box-shadow .2s}
.q.bad{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-l)}
.q h2{font-size:1.18rem;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.q h2 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--terra-l);color:var(--terra);display:grid;place-items:center;font-family:var(--body);font-weight:800;font-size:.95rem;margin-top:-2px}
.meter{font-weight:800;font-size:1.05rem;margin-bottom:6px}
.meter b{font-family:var(--head);font-size:2rem;color:var(--terra)}
input[type=range]{width:100%;accent-color:var(--terra);height:28px;margin:4px 0 0}
input[type=range].untouched{opacity:.55}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:14px}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-weight:600;background:var(--bg);transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--sage)}
.opt input{width:20px;height:20px;accent-color:var(--sage-d);flex:none;margin:0}
.opt:has(input:checked){background:var(--sage-l);border-color:var(--sage-d)}
.other-in{margin:-2px 0 2px 32px}
.other-in input{padding:9px 12px}

/* Soal bertahap */
.wait{display:flex;gap:14px;align-items:center;background:var(--sage-l);border:1.5px dashed var(--sage-d);border-radius:20px;padding:18px;margin-bottom:16px}
.wait-ic{font-size:2rem;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.mask-note{font-size:.85rem;font-weight:700;color:var(--muted);margin:-4px 0 12px}
.stepper{display:flex;gap:8px}
.stepper .sp{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);color:var(--muted)}
.stepper .sp.on{background:var(--sage-d);color:#fff}
.stepper .sp.cur{background:var(--terra);box-shadow:0 0 0 4px var(--terra-l)}
/* Papan guru */
.ctrlbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px}
.cb-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cb-main{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cb-q{flex:1;min-width:240px;font-size:1.05rem;line-height:1.4}
.cb-foot{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.cb-count{flex:1;min-width:220px;font-weight:700}
.cb-count b{font-family:var(--head);font-size:1.6rem}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:1.4rem}
.stepper .sp{border:0;font-family:inherit;font-size:1rem;cursor:pointer}
.stepper .sp:disabled{cursor:not-allowed;opacity:.5}
.stepper .sp.view{outline:2.5px solid var(--ink);outline-offset:2px}
.ans-text{margin:8px 0 0;overflow-wrap:anywhere}
.ans-text.big{font-size:clamp(1.3rem,2.6vw,2.2rem);line-height:1.4}
.pct.big{font-size:clamp(2.6rem,6vw,4.6rem);margin-top:6px}
.chips.big{gap:10px;margin-top:8px}
.chips.big .chip{font-size:clamp(1rem,2vw,1.6rem);padding:6px 20px}
.bq{margin:2px 0 14px;font-weight:700;color:var(--muted);font-size:clamp(1rem,1.7vw,1.4rem)}
/* Review */
.sum{display:grid;gap:0}
.sum-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.sum-row:last-child{border:0}
.sum-row dt{font-weight:800;color:var(--muted);font-size:.9rem}
.sum-row dd{margin:0;overflow-wrap:anywhere}
.actions-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* Thanks */
.thanks{text-align:center;padding:36px 24px;position:relative;overflow:hidden}
.thanks h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:8px}
.sprout{font-size:4rem;display:inline-block;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.leaf{position:absolute;top:-30px;font-size:1.4rem;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(420px) rotate(240deg);opacity:0}}
.codebox{margin-top:22px;text-align:left;background:var(--surface2);border-radius:16px;padding:14px}
.codebox textarea{min-height:70px;font-size:.78rem;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Board */
.bar-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar-top h1{font-size:clamp(1.5rem,3.6vw,2.2rem)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select{width:auto;min-width:150px;padding:9px 12px;border-radius:999px;font-weight:700;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;align-items:start}
.rcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sage);border-radius:20px;box-shadow:var(--shadow-s);padding:16px 16px 12px;animation:cardin .45s both;display:flex;flex-direction:column;gap:12px}
.rcard.c0{border-top-color:var(--terra)}.rcard.c1{border-top-color:var(--amber)}.rcard.c2{border-top-color:var(--sage)}.rcard.c3{border-top-color:var(--sage-d)}
.rcard.mine{box-shadow:0 0 0 3px var(--terra),var(--shadow)}
@keyframes cardin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.rc-head{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-l);color:var(--sage-d);font-weight:800;display:grid;place-items:center;flex:none}
.rc-head b{display:block;line-height:1.2;overflow-wrap:anywhere}
.rc-head small{color:var(--muted);font-weight:700}
.rc-head .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 8px;border-radius:8px}
.rc-head .x:hover{background:var(--terra-l);color:var(--terra)}
.sec-t{display:block;font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-bottom:5px}
.pct{font-family:var(--head);font-size:1.9rem;font-weight:700;line-height:1}
.pct small{font-family:var(--body);font-size:.78rem;font-weight:800;color:var(--muted);margin-left:8px}
.bar{height:7px;background:var(--surface2);border-radius:99px;margin:7px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.quote{margin:0;font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--sage-l);color:var(--sage-d);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem}
.chip.t{background:var(--terra-l);color:var(--terra)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);grid-column:1/-1;border:2px dashed var(--line);border-radius:22px}

/* Dashboard */
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-s);padding:20px}
.dc h3{font-size:1.05rem;margin-bottom:12px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.bignum{font-family:var(--head);font-size:2.6rem;font-weight:700;line-height:1}
.bignum small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:700}
.ring{--v:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--sage-d) calc(var(--v)*1%),var(--surface2) 0);display:grid;place-items:center;margin:4px auto 6px;position:relative}
.ring::before{content:"";position:absolute;inset:14px;background:var(--surface);border-radius:50%}
.ring span{position:relative;font-family:var(--head);font-weight:700;font-size:1.9rem}
.vcols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.vcol{text-align:center}
.vcol-v{font-weight:800;font-size:1.2rem}
.vcol-bar{height:130px;background:var(--surface2);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden;margin:4px 0 8px}
.vcol-bar i{display:block;width:100%;border-radius:12px 12px 0 0;min-height:3px;transition:height .5s}
.vcol-l b{display:block;font-size:.85rem;line-height:1.2}.vcol-l span{font-size:.75rem;color:var(--muted);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 30px;gap:10px;align-items:center;margin-bottom:9px;font-size:.9rem}
.hb-l{font-weight:700;line-height:1.25}
.hb-track{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px;transition:width .5s}
.hb-v{font-weight:800;text-align:right}
.cloud{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;align-items:center;padding:8px 4px;line-height:1.1}
.cloud span{font-family:var(--head);font-weight:700;white-space:nowrap}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .tot{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.ctrl .tot input{width:70px;padding:7px 10px;border-radius:12px;text-align:center}
.helpbox{background:var(--sage-l);border-radius:14px;padding:10px 14px;font-size:.88rem;margin-top:12px}
.insight{background:var(--terra-l);border-radius:14px;padding:12px 16px;font-weight:700;margin-top:14px}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:100;overflow:auto;animation:fade .15s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:24px;max-width:600px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}
.modal h2{font-size:1.3rem;margin-bottom:12px}
.mrow{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;font-size:.92rem;z-index:200;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* Presentation */
.pres{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px clamp(16px,4vw,56px)}
.pres-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pres-top h2{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--terra)}
.pres-body{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .3s both}
.pres-sum{display:grid;grid-template-columns:1fr 1.5fr 1.3fr;gap:clamp(14px,2.4vw,32px);align-items:start}
.pres-sum .dc{padding:clamp(16px,2vw,28px)}
.pres-sum .bignum{font-size:clamp(2.6rem,6vw,5rem)}
.pres-sum .ring{width:clamp(130px,16vw,220px);height:clamp(130px,16vw,220px)}
.pres-sum .ring span{font-size:clamp(1.8rem,3.4vw,3rem)}
.pres-sum .hb{font-size:clamp(.95rem,1.5vw,1.3rem)}
.pres-sum .vcol-bar{height:clamp(120px,24vh,260px)}
.pres-sum .vcol-l b{font-size:clamp(.8rem,1.3vw,1.1rem)}
.top-culture{margin-top:14px;background:var(--terra-l);border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(1rem,1.6vw,1.4rem)}
.pres-cloud .cloud{gap:10px 28px}
.big-card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--sage);border-radius:28px;box-shadow:var(--shadow);padding:clamp(20px,3vw,44px);max-width:1100px;margin:0 auto;width:100%}
.big-card.c0{border-top-color:var(--terra)}.big-card.c1{border-top-color:var(--amber)}.big-card.c2{border-top-color:var(--sage)}.big-card.c3{border-top-color:var(--sage-d)}
.big-card .bc-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.big-card .bc-name{font-family:var(--head);font-size:clamp(1.4rem,2.6vw,2.2rem);font-weight:700}
.big-card .bc-pct{margin-left:auto;font-family:var(--head);font-size:clamp(2.4rem,5vw,4.2rem);font-weight:700;color:var(--terra);line-height:1}

<script>
(function(){
'use strict';

/* ====== Konstanta ====== */
/* ============ ISI BAGIAN INI (lihat PANDUAN-PASANG-ONLINE.md) ============ */
var FIREBASE_CONFIG={
  apiKey:'ISI_API_KEY',
  authDomain:'ISI_PROJECT_ID.firebaseapp.com',
  projectId:'ISI_PROJECT_ID',
  appId:'ISI_APP_ID'
};
var TEACHER_EMAIL='guru@contoh.com'; /* email akun guru di Firebase Authentication */
/* Kode Guru = password akun tersebut (minimal 6 karakter), misalnya KPK2026 */
/* ======================================================================= */
var CULTURE=['Kamis Pon','Persiapan kirab budaya','Memasak jajanan tradisional'];
var FOLLOW=['Bertanya kepada guru','Berdiskusi dengan teman','Berlatih dengan soal yang lebih sederhana','Mencoba lagi dengan cara yang berbeda'];
var FOLLOW_SHORT=['Bertanya kepada guru','Berdiskusi dengan teman','Latihan soal lebih sederhana','Mencoba cara berbeda'];
var CATS=[
  {label:'Perlu bantuan',range:'0–40%',color:'var(--terra)'},
  {label:'Mulai memahami',range:'41–70%',color:'var(--amber)'},
  {label:'Memahami',range:'71–90%',color:'var(--sage)'},
  {label:'Sangat memahami',range:'91–100%',color:'var(--sage-d)'}
];
var KELAS=['VII A','VII B','VII C','VII D','VII E','VII F','VII G','VII H'];
var QTEXT=['Seberapa paham kamu tentang KPK setelah belajar hari ini?','Kapan kita menggunakan KPK?','Kegiatan atau budaya Yogyakarta apa yang kita gunakan untuk belajar KPK hari ini?','Menurutmu, apa manfaat KPK dalam kegiatan di sekitar kita?','Jika kamu masih belum paham tentang KPK, apa yang akan kamu lakukan?'];
var ALIAS=['Apem','Pukis','Kawung','Parang','Wayang','Gamelan','Kirab','Gudeg','Merapi','Malioboro','Blangkon','Angklung'];
var ALIAS_EMO=['🍘','🥮','🌀','🌊','🎭','🥁','🚩','🍛','🌋','🛍','🎩','🎶'];
var LS_R='mdsk_reflections_v1',LS_S='mdsk_settings_v1';
var STOP=('yang dan di ke dari untuk dengan pada itu ini saya aku kita kami menurut adalah ada bisa dapat karena atau juga agar supaya sebagai dalam oleh akan sudah lebih jika ketika saat kalau para tersebut sebuah suatu tidak bagi lalu serta sehingga tapi tetapi masih bahwa mereka kamu dia apa bagaimana sangat sekali jadi digunakan nya sama saja lagi bila maka seperti yaitu yaitu hal cara').split(' ');
var PALETTE=['var(--terra)','var(--sage-d)','var(--brown)','var(--amber)','var(--ink)'];

/* ====== Util ====== */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function catIdx(p){return p<=40?0:p<=70?1:p<=90?2:3}
function str(v,n){return typeof v==='string'?v.trim().slice(0,n):''}
function arrOf(v,allowed){return Array.isArray(v)?allowed.filter(function(a){return v.indexOf(a)>-1}):[]}
function clean(r){
  if(!r||typeof r!=='object')return null;
  var p=(r.p1===null||r.p1===undefined||r.p1==='')?NaN:Number(r.p1);
  var nama=str(r.nama,40);
  var id=str(r.id,60).replace(/[^A-Za-z0-9_-]/g,'')||uid();
  return {id:id,nama:nama,kelas:str(r.kelas,10),p1:isFinite(p)?Math.max(0,Math.min(100,Math.round(p))):null,a1:str(r.a1,600),a2:str(r.a2,600),
    culture:arrOf(r.culture,CULTURE),cultureOther:str(r.cultureOther,80),a4:str(r.a4,600),
    follow:arrOf(r.follow,FOLLOW),followOther:str(r.followOther,80),ts:Number(r.ts)||Date.now()};
}
function encCode(r){return 'KPK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(r))))}
function decCode(s){
  s=(s||'').trim();if(s.indexOf('KPK1:')!==0)return null;
  try{return clean(JSON.parse(decodeURIComponent(escape(atob(s.slice(5))))))}catch(e){return null}
}
function toast(msg){
  var t=$('#toast');t.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.innerHTML=''},2800);
}
function copyText(text){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Tersalin ✓')},function(){toast(fallback()?'Tersalin ✓':'Salin manual dari kotak teks')});
  }else toast(fallback()?'Tersalin ✓':'Salin manual dari kotak teks');
}

/* ====== State ====== */
function blankDraft(nama,kelas){return {nama:nama||'',kelas:kelas||'',p1:null,a1:'',a2:'',culture:[],cultureOn:false,cultureOther:'',a4:'',follow:[],followOn:false,followOther:''}}
var S={
  view:'landing',teacher:false,draft:blankDraft(),
  shared:[],local:(lsGet(LS_R,[])||[]).map(clean).filter(Boolean),
  sharedSettings:{},localSettings:lsGet(LS_S,{})||{},
  db:null,user:null,canWrite:false,canEdit:false,
  filter:{kelas:'',cat:'',budaya:''},dashKelas:'',slide:0,hideNames:true,
  showReal:false,names:{},auth:null,unsubNames:null,viewQ:null,seen:{},myId:null,sentStep:0,pendingRender:false,lastId:null,lastCode:null,lastShared:false,modal:null,submitting:false
};

function allRecs(){
  var map={},out=[];
  S.shared.forEach(function(r){map[r.id]=1;out.push(r)});
  S.local.forEach(function(r){if(!map[r.id])out.push(r)});
  out=out.map(function(r){var n=S.names[r.id];return n?Object.assign({},r,{nama:n}):r});
  return out.sort(function(a,b){return b.ts-a.ts});
}
function settings(){
  var s=Object.keys(S.sharedSettings).length?S.sharedSettings:S.localSettings;
  var st=Math.round(Number(s.step));return {locked:!!s.locked,total:Number(s.total)>0?Number(s.total):30,step:st>=1&&st<=5?st:1,session:Number(s.session)||0};
}
function isLocked(){return settings().locked}
function modeInfo(){
  if(S.db)return {k:'on',t:'Terhubung ke papan online'};
  return {k:'off',t:'Menyambung…'};
}
function sharedOn(){return !!(S.db&&S.canWrite)}

/* ====== Statistik ====== */
function filtered(list,f){
  return list.filter(function(r){
    if(f.kelas&&r.kelas!==f.kelas)return false;
    if(f.cat!==''&&f.cat!=null&&(r.p1==null||catIdx(r.p1)!==Number(f.cat)))return false;
    if(f.budaya){
      if(f.budaya==='Lainnya'){if(!r.cultureOther)return false}
      else if(r.culture.indexOf(f.budaya)<0)return false;
    }
    return true;
  });
}
function stats(list){
  var n=list.length,n1=0,sum=0,dist=[0,0,0,0],fc=[0,0,0,0],fo=0,cc=[0,0,0],co=0;
  list.forEach(function(r){
    if(r.p1!=null){sum+=r.p1;n1++;dist[catIdx(r.p1)]++}
    FOLLOW.forEach(function(f,i){if(r.follow.indexOf(f)>-1)fc[i]++});
    if(r.followOther)fo++;
    CULTURE.forEach(function(c,i){if(r.culture.indexOf(c)>-1)cc[i]++});
    if(r.cultureOther)co++;
  });
  return {n:n,avg:n1?Math.round(sum/n1):0,dist:dist,fc:fc,fo:fo,cc:cc,co:co};
}
function words(list){
  var counts={};
  list.forEach(function(r){
    [r.a2,r.a4].forEach(function(t){
      if(!t)return;
      var s=t.toLowerCase().replace(/kamis\s+pon/g,'kamis-pon');
      (s.match(/[a-zà-ÿ0-9\-]+/g)||[]).forEach(function(w){
        if(w.length<3||STOP.indexOf(w)>-1||/^\d+$/.test(w))return;
        counts[w]=(counts[w]||0)+1;
      });
    });
  });
  return Object.keys(counts).map(function(w){return {w:w.replace('kamis-pon','Kamis Pon'),c:counts[w]}})
    .sort(function(a,b){return b.c-a.c||(a.w<b.w?-1:1)}).slice(0,40);
}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function cloudHtml(list,big){
  var ws=words(list);
  if(!ws.length)return '<p class="muted" style="text-align:center">Kata kunci akan muncul setelah murid mengirim refleksi.</p>';
  var mx=ws[0].c,mn=ws[ws.length-1].c;
  var lo=big?1.2:1,hi=big?4.2:2.6;
  ws.sort(function(a,b){return hash(a.w)%97-hash(b.w)%97});
  return '<div class="cloud">'+ws.map(function(x,i){
    var t=mx===mn?.5:(x.c-mn)/(mx-mn);
    var size=(lo+(hi-lo)*t).toFixed(2);
    return '<span title="'+x.c+'×" style="font-size:'+size+'rem;color:'+PALETTE[hash(x.w)%PALETTE.length]+'">'+esc(x.w)+'</span>';
  }).join('')+'</div>';
}
function hbars(items){
  var mx=Math.max(1,Math.max.apply(null,items.map(function(i){return i[1]})));
  return items.map(function(it){
    return '<div class="hb"><div class="hb-l">'+esc(it[0])+'</div><div class="hb-track"><i style="width:'+Math.round(it[1]/mx*100)+'%;background:'+(it[2]||'var(--sage-d)')+'"></i></div><div class="hb-v">'+it[1]+'</div></div>';
  }).join('');
}
function vcols(dist){
  var mx=Math.max(1,Math.max.apply(null,dist));
  return '<div class="vcols">'+CATS.map(function(c,i){
    return '<div class="vcol"><div class="vcol-v">'+dist[i]+'</div><div class="vcol-bar"><i style="height:'+(dist[i]/mx*100)+'%;background:'+c.color+'"></i></div><div class="vcol-l"><b>'+c.label+'</b><span>'+c.range+'</span></div></div>';
  }).join('')+'</div>';
}
function cultureItems(st){
  var items=CULTURE.map(function(c,i){return [c,st.cc[i],'var(--terra)']});
  if(st.co)items.push(['Lainnya',st.co,'var(--brown)']);
  return items;
}
function topCulture(st){
  var it=cultureItems(st).slice().sort(function(a,b){return b[1]-a[1]});
  return it.length&&it[0][1]>0?it[0]:null;
}
function chipsOf(r,kind){
  var a=kind==='c'?r.culture.slice():r.follow.slice(),o=kind==='c'?r.cultureOther:r.followOther;
  if(o)a.push('Lainnya: '+o);
  if(!a.length)return '<span class="muted small">—</span>';
  return a.map(function(x){return '<span class="chip'+(kind==='c'?' t':'')+'">'+esc(x)+'</span>'}).join('');
}

/* ====== Ilustrasi ====== */
function bandSvg(){return '<div class="band"><svg viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" fill="url(#kawung)"/></svg></div>'}
function heroArt(){
  return '<svg viewBox="0 0 440 360" role="img" aria-label="Ilustrasi kalender Kamis Pon, apem, pukis, dan simbol matematika">'+
  '<circle cx="220" cy="180" r="165" style="fill:var(--sage-l)"/>'+
  '<rect x="30" y="236" width="380" height="96" rx="20" style="fill:var(--terra-l)"/>'+
  '<rect x="30" y="236" width="380" height="96" rx="20" fill="url(#kawung)" opacity=".55"/>'+
  '<g transform="rotate(-4 120 120)"><rect x="46" y="44" width="176" height="162" rx="16" style="fill:var(--surface);stroke:var(--line)" stroke-width="2"/>'+
  '<path d="M46 60a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16v26H46z" style="fill:var(--terra)"/>'+
  '<circle cx="82" cy="44" r="5" style="fill:var(--surface)"/><circle cx="186" cy="44" r="5" style="fill:var(--surface)"/>'+
  '<text x="134" y="73" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="15" fill="#fff">KAMIS PON</text>'+
  [0,1,2,3,4].map(function(c){return [0,1,2,3].map(function(r){
    var on=(c===2&&r===1)||(c===4&&r===3);
    return '<circle cx="'+(76+c*30)+'" cy="'+(112+r*24)+'" r="'+(on?9:4)+'" style="fill:'+(on?'var(--terra)':'var(--line)')+'"/>';
  }).join('')}).join('')+'</g>'+
  '<ellipse cx="300" cy="288" rx="86" ry="22" style="fill:var(--surface);stroke:var(--brown)" stroke-width="2"/>'+
  '<ellipse cx="270" cy="270" rx="38" ry="24" style="fill:#F4E3C1;stroke:var(--brown)" stroke-width="2"/>'+
  '<ellipse cx="270" cy="264" rx="26" ry="13" style="fill:#FBF1DB"/>'+
  '<path d="M312 282c0-24 18-38 40-38s30 18 30 38z" style="fill:#D9A441;stroke:var(--brown)" stroke-width="2"/>'+
  '<path d="M326 276c2-12 10-20 26-20" fill="none" style="stroke:#F4E3C1" stroke-width="3" stroke-linecap="round"/>'+
  '<g font-family="Fraunces,Georgia,serif" font-weight="700">'+
  '<rect x="256" y="52" width="92" height="44" rx="22" style="fill:var(--sage-d)"/><text x="302" y="82" text-anchor="middle" font-size="24" fill="#fff">KPK</text>'+
  '<text x="372" y="66" font-size="40" style="fill:var(--terra)">×</text>'+
  '<text x="258" y="142" font-size="34" style="fill:var(--brown)">12</text>'+
  '<text x="326" y="170" font-size="34" style="fill:var(--sage-d)">18</text>'+
  '<text x="384" y="140" font-size="36" style="fill:var(--amber)">÷</text>'+
  '<text x="228" y="200" font-size="30" style="fill:var(--terra)" opacity=".8">36</text></g></svg>';
}
function answered(r,q){
  if(q===1)return r.p1!=null&&!!r.a1;
  if(q===2)return !!r.a2;
  if(q===3)return r.culture.length>0||!!r.cultureOther;
  if(q===4)return !!r.a4;
  return r.follow.length>0||!!r.followOther;
}
function isComplete(r){return [1,2,3,4,5].every(function(q){return answered(r,q)})}
function completeRecs(){return allRecs().filter(isComplete)}
function curQ(){var st=settings().step,q=S.viewQ||st;return q>st?st:q}
function catLabel(p){return p==null?'—':CATS[catIdx(p)].label}
function ansBlock(r,q,big){
  var c=big?' big':'';
  if(q===1){var ci=catIdx(r.p1);return '<div class="pct'+c+'">'+r.p1+'%<small>'+CATS[ci].label+'</small></div><div class="bar"><i style="width:'+r.p1+'%;background:'+CATS[ci].color+'"></i></div><p class="ans-text'+c+'">“'+esc(r.a1)+'”</p>'}
  if(q===2)return '<p class="ans-text'+c+'">'+esc(r.a2)+'</p>';
  if(q===3)return '<div class="chips'+c+'">'+chipsOf(r,'c')+'</div>';
  if(q===4)return '<p class="ans-text'+c+'">'+esc(r.a4)+'</p>';
  return '<div class="chips'+c+'">'+chipsOf(r,'f')+'</div>';
}
function ansCard(r,q,i){
  var key=r.id+':'+q,seen=S.seen[key];S.seen[key]=1;
  var ci=q===1&&r.p1!=null?catIdx(r.p1):2;
  return '<article class="rcard c'+ci+'" style="'+(seen?'animation:none':'animation-delay:'+Math.min(i,10)*40+'ms')+'">'+
  '<div class="rc-head"><div class="avatar">'+esc(dispInit(r))+'</div><div><b>'+esc(dispName(r))+'</b><small>'+esc(r.kelas)+'</small></div>'+
  '<button class="x" data-act="del" data-id="'+esc(r.id)+'" title="Hapus jawaban" aria-label="Hapus jawaban">🗑</button></div>'+ansBlock(r,q,false)+'</article>';
}
function aliasOf(r){var h=hash(r.id);return {n:'Murid '+ALIAS[h%ALIAS.length],e:ALIAS_EMO[h%ALIAS.length]}}
function dispName(r){return (S.teacher&&S.showReal&&r.nama)?r.nama:aliasOf(r).n}
function dispInit(r){return (S.teacher&&S.showReal&&r.nama)?r.nama[0].toUpperCase():aliasOf(r).e}
function footHtml(){
  var m=modeInfo();
  return '<div class="foot"><span class="mode '+m.k+'"><i></i>'+m.t+'</span>'+
    '<button class="linkbtn" data-act="teacherLogin">'+(S.teacher?'Buka Dashboard Guru':'Area Guru')+'</button></div>';
}
function steps(n){
  var names=['Identitas','Refleksi','Kirim'];
  return '<div class="steps">'+names.map(function(t,i){
    var c=i+1<n?'done':i+1===n?'on':'';
    return '<span class="'+c+'"><b>'+(i+1<n?'✓':i+1)+'</b>'+t+'</span>'+(i<2?'<em></em>':'');
  }).join('')+'</div>';
}

/* ====== Views ====== */
function vLanding(){
  var lock=isLocked();
  return '<div class="wrap">'+
  (lock?'<div class="notice">🔒 Papan refleksi sedang dikunci oleh guru. Kamu masih bisa melihat papan kelas.</div>':'')+
  '<section class="hero"><div class="hero-text">'+
  '<p class="eyebrow">Refleksi Pembelajaran KPK</p>'+
  '<h1>MATEMATIKA DI SEKITAR KITA</h1>'+
  '<p class="lead">Yuk, lihat kembali apa yang kamu temukan hari ini!</p>'+
  '<div class="actions"><button class="btn primary big" data-act="start"'+(lock?' disabled':'')+'>Mulai Refleksi</button>'+
  '<button class="btn ghost" data-act="board">Lihat Papan Kelas</button></div>'+
  '<div class="tags"><span class="tag">Kamis Pon</span><span class="tag">Kirab budaya</span><span class="tag">Apem &amp; pukis</span></div>'+
  '</div><div class="hero-art">'+heroArt()+'</div></section>'+footHtml()+'</div>';
}
function vIdentity(){
  var d=S.draft;
  return '<div class="wrap narrow">'+steps(1)+'<div class="card">'+
  '<h2 style="margin-bottom:6px">Kenalan dulu, yuk</h2>'+
  '<p class="muted" style="margin-top:0">Namamu akan tampil di kartu refleksimu. Tidak perlu login, email, atau nomor telepon.</p>'+
  '<div class="field"><label for="nama">Nama</label><input type="text" id="nama" maxlength="30" autocomplete="off" placeholder="Tulis namamu" value="'+esc(d.nama)+'"></div>'+
  '<div class="field"><label for="kelas">Kelas</label><select id="kelas"><option value="">Pilih kelas…</option>'+
  KELAS.map(function(k){return '<option'+(d.kelas===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>'+
  '<div class="err" id="idErr"></div>'+
  '<div class="actions-row"><button class="btn ghost" data-act="home">Kembali</button><button class="btn primary" data-act="idNext">Lanjut</button></div>'+
  '</div></div>';
}
function qOpt(group,i,label,checked){
  return '<label class="opt"><input type="checkbox" data-grp="'+group+'" data-i="'+i+'"'+(checked?' checked':'')+'><span>'+esc(label)+'</span></label>';
}
function vReflect(){
  var d=S.draft,step=settings().step;

function vPresent(){
  var q=curQ(),all=allRecs();
  var base=S.dashKelas?all.filter(function(r){return r.kelas===S.dashKelas}):all;
  var list=base.filter(function(r){return answered(r,q)});
  var total=2+list.length;
  if(S.slide>=total)S.slide=total-1;
  if(S.slide<0)S.slide=0;
  var body='',title='';
  if(S.slide===0){
    var st=stats(base),tc=topCulture(st);
    title='Ringkasan Kelas';
    body='<div class="pres-sum">'+
    '<div class="dc"><h3>Yang sudah mengisi</h3><div class="bignum">'+all.filter(isComplete).length+' <small>/ '+settings().total+'</small></div>'+
    '<h3 style="margin-top:18px">Rata-rata pemahaman</h3><div class="ring" style="--v:'+st.avg+'"><span>'+st.avg+'%</span></div></div>'+
    '<div class="dc"><h3>Sebaran pemahaman</h3>'+vcols(st.dist)+'</div>'+
    '<div class="dc"><h3>Budaya yang dipelajari</h3>'+hbars(cultureItems(st))+(tc?'<div class="top-culture">Paling banyak dipilih: '+esc(tc[0])+'</div>':'')+'</div></div>';
  }else if(S.slide===1){
    title='Kata Kunci dari Jawaban Kita';
    body='<div class="dc pres-cloud" style="padding:clamp(18px,3vw,40px)">'+cloudHtml(base,true)+'</div>';
  }else{
    var r=list[S.slide-2],ci=q===1&&r.p1!=null?catIdx(r.p1):2;
    title='Soal '+q+' · Jawaban '+(S.slide-1)+' dari '+list.length;
    var nm=(S.hideNames||!r.nama)?aliasOf(r).n:esc(r.nama.split(' ')[0]);
    var em=(S.hideNames||!r.nama)?aliasOf(r).e:esc(r.nama[0].toUpperCase());
    body='<div class="big-card c'+ci+'"><div class="bc-head"><div class="avatar" style="width:54px;height:54px;font-size:1.4rem">'+em+'</div>'+
    '<div><div class="bc-name">'+nm+'</div><span class="muted" style="font-weight:700">'+esc(r.kelas)+'</span></div></div>'+
    '<span class="sec-t">❓ Soal '+q+'</span><p class="bq">'+esc(QTEXT[q-1])+'</p>'+ansBlock(r,q,true)+'</div>';
  }
  return '<div class="pres"><div class="pres-top"><h2>Matematika di Sekitar Kita · '+title+'</h2>'+
  '<div class="toolbar"><button class="btn ghost sm" data-act="toggleNames">'+(S.hideNames?'👁 Tampilkan nama':'🙈 Sembunyikan nama')+'</button>'+
  '<button class="btn ghost sm" data-act="fullscreen">⛶ Layar penuh</button><button class="btn ghost sm" data-act="exitPresent">Keluar</button></div></div>'+
  '<div class="pres-body" id="presBody">'+body+'</div>'+
  '<div class="pres-nav"><button class="btn ghost" data-act="prev"'+(S.slide===0?' disabled':'')+'>← Sebelumnya</button>'+
  '<span class="count">'+(S.slide+1)+' / '+total+'</span>'+
  '<button class="btn primary" data-act="next"'+(S.slide>=total-1?' disabled':'')+'>Berikutnya →</button></div></div>';
}

/* ====== Modal ====== */
function renderModal(){
  var m=S.modal,el=$('#modal');
  if(!m){el.innerHTML='';return}
  var inner='';
  if(m.type==='detail'){
    var r=allRecs().filter(function(x){return x.id===m.id})[0];
    if(!r){S.modal=null;el.innerHTML='';return}
    var cat=CATS[catIdx(r.p1)];
    inner='<h2>'+esc(dispName(r))+' <span class="muted" style="font-size:.9rem;font-family:var(--body)">· '+esc(r.kelas)+'</span></h2>'+
    '<div class="mrow"><span class="sec-t">📊 Pemahamanku</span><b style="font-size:1.4rem">'+r.p1+'%</b> <span class="muted">· '+cat.label+'</span><div class="bar"><i style="width:'+r.p1+'%;background:'+cat.color+'"></i></div><p style="margin:0;overflow-wrap:anywhere">“'+esc(r.a1)+'”</p></div>'+
    '<div class="mrow"><span class="sec-t">❓ Kapan kita menggunakan KPK?</span><p style="margin:0;overflow-wrap:anywhere">'+esc(r.a2)+'</p></div>'+
    '<div class="mrow"><span class="sec-t">🏯 Budaya yang kupelajari</span><div class="chips">'+chipsOf(r,'c')+'</div></div>'+
    '<div class="mrow"><span class="sec-t">✨ Manfaat KPK di sekitar kita</span><p style="margin:0;overflow-wrap:anywhere">'+esc(r.a4)+'</p></div>'+
    '<div class="mrow"><span class="sec-t">🌱 Langkah selanjutnya</span><div class="chips">'+chipsOf(r,'f')+'</div></div>'+
    '<div class="actions-row" style="margin-top:8px">'+(S.teacher?'<button class="btn danger sm" data-act="del" data-id="'+esc(r.id)+'">Hapus</button>':'')+'<button class="btn ghost sm" data-act="closeModal">Tutup</button></div>';
  }else if(m.type==='confirm'){
    inner='<h2>'+esc(m.title)+'</h2><p>'+esc(m.msg)+'</p><div class="actions-row"><button class="btn ghost" data-act="closeModal">Batal</button><button class="btn primary" data-act="confirmYes">Ya, lanjutkan</button></div>';
  }else if(m.type==='newsession'){
    var cnt=allRecs().length;
    inner='<h2>Mulai sesi baru?</h2><p>Ini akan <b>menghapus '+cnt+' refleksi</b> di papan, mengembalikan soal ke soal 1, dan membuka kunci papan. Murid yang sedang mengisi akan kembali ke beranda dengan isian kosong.</p>'+
    '<p class="small muted">Simpan dulu datanya jika masih diperlukan. Pengaturan jumlah murid tetap dipertahankan.</p>'+
    '<div class="actions-row"><button class="btn ghost" data-act="closeModal">Batal</button><button class="btn ghost" data-act="exportCsv">⬇ Ekspor CSV dulu</button><button class="btn primary" data-act="confirmNew">Mulai sesi baru</button></div>';
  }else if(m.type==='import'){
    inner='<h2>Impor kode refleksi</h2><p class="small muted">Tempel satu atau beberapa kode (satu kode per baris) yang dikirim murid. Kode diawali <b>KPK1:</b>.</p>'+
    '<textarea id="importTa" style="min-height:140px;font-size:.78rem" placeholder="KPK1:..."></textarea><div class="err" id="impErr"></div>'+
    '<div class="actions-row" style="margin-top:8px"><button class="btn ghost" data-act="closeModal">Batal</button><button class="btn primary" data-act="doImport">Impor</button></div>';
  }
  el.innerHTML='<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';
}

/* ====== Render ====== */
function render(){
  var v=S.view,h='';
  if(v==='landing')h=vLanding();
  else if(v==='identity')h=vIdentity();
  else if(v==='reflect')h=vReflect();
  else if(v==='review')h=vReview();
  else if(v==='thanks')h=vThanks();
  else if(v==='board')h=vBoard();
  else if(v==='login')h=vLogin();
  else if(v==='setup')h=vSetup();
  else if(v==='dash')h=S.teacher?vDash():vLogin();
  else if(v==='present')h=S.teacher?vPresent():vLogin();
  $('#app').innerHTML=h;
  if(v==='reflect')updateProgress();
  renderModal();
}
function go(v){if(v==='board'&&S.teacher)v='dash';S.view=v;render();window.scrollTo(0,0)}
function onData(){
  var v=S.view,ae=document.activeElement;
  var ses=settings().session;
  if(S.knownSession===undefined)S.knownSession=ses;
  else if(ses!==S.knownSession){
    S.knownSession=ses;
    if(!S.teacher){
      S.draft=blankDraft();S.myId=null;S.sentStep=0;S.lastId=null;S.lastCode=null;S.filter={kelas:'',cat:'',budaya:''};
      if(v==='identity'||v==='reflect'||v==='review'||v==='thanks'){S.view='landing';v='landing';render();toast('Guru memulai sesi baru. Silakan mulai lagi dari awal.')}
    }
  }
  var typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(S.modal&&S.modal.type==='detail')renderModal();
  if(v==='reflect'){
    var stp=settings().step;
    if(S.lastStep!==stp){
      S.lastStep=stp;
      if(typing){S.pendingRender=true}else{collectFromDom();render()}
    }
    return;
  }
  S.lastStep=settings().step;
  if(v==='board'||v==='dash'||v==='present'||v==='landing'){if(!typing)render()}
}

/* ====== Aksi data ====== */
async function saveRecord(rec){
  if(!S.db){toast('Belum tersambung ke database.');return false}
  var pub=Object.assign({},rec);delete pub.nama;
  try{
    var b=S.db.batch();
    b.set(S.db.collection('reflections').doc(rec.id),pub);
    b.set(S.db.collection('names').doc(rec.id),{nama:rec.nama});
    await b.commit();
    return true;
  }catch(e){
    toast(isLocked()?'Papan sedang dikunci oleh guru.':'Jawaban belum terkirim. Periksa koneksi internet lalu coba lagi.');
    return false;
  }
}
async function removeRec(id){
  if(S.db){
    try{
      var b=S.db.batch();
      b.delete(S.db.doc('reflections/'+id));
      b.delete(S.db.doc('names/'+id));
      await b.commit();
    }catch(e){toast('Tidak bisa menghapus. Pastikan Anda masuk sebagai guru.')}
  }
  S.shared=S.shared.filter(function(r){return r.id!==id});
}
async function setSettings(patch){
  var next=Object.assign({},settings(),patch);
  if(!(S.db&&S.canEdit)){toast('Masuk sebagai guru dulu.');return}
  try{await S.db.doc('settings/board').set({locked:!!next.locked,total:next.total,step:next.step,session:next.session||0})}
  catch(e){toast('Pengaturan gagal disimpan. Periksa koneksi dan aturan Firestore.')}
}
async function clearAll(){
  var ids=allRecs().map(function(r){return r.id});
  for(var i=0;i<ids.length;i++)await removeRec(ids[i]);
  S.local=[];lsSet(LS_R,[]);S.shared=[];S.lastId=null;
}
function csvEsc(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
async function exportCsv(){
  var rows=[['Nama','Kelas','Pemahaman (%)','Kategori','Alasan','KPK digunakan ketika','Budaya','Manfaat KPK','Tindak lanjut','Waktu kirim']];
  allRecs().slice().reverse().forEach(function(r){
    rows.push([r.nama,r.kelas,r.p1,catLabel(r.p1),r.a1,r.a2,r.culture.concat(r.cultureOther?['Lainnya: '+r.cultureOther]:[]).join('; '),r.a4,r.follow.concat(r.followOther?['Lainnya: '+r.followOther]:[]).join('; '),new Date(r.ts).toLocaleString('id-ID')]);
  });
  var csv='\ufeff'+rows.map(function(r){return r.map(csvEsc).join(',')}).join('\r\n');
  try{
    var dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:'refleksi-kpk.csv',data:csv});toast('File CSV disiapkan');return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='refleksi-kpk.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){toast('Ekspor tidak tersedia di tampilan ini.')}
}

/* ====== Event handling ====== */
function collectFromDom(){
  var d=S.draft,g=function(id){return document.getElementById(id)};
  if(g('a1'))d.a1=g('a1').value;
  if(g('a2'))d.a2=g('a2').value;
  if(g('a4'))d.a4=g('a4').value;
  if(g('cultureOther'))d.cultureOther=g('cultureOther').value;
  if(g('followOther'))d.followOther=g('followOther').value;
  if(g('cultureOn'))d.cultureOn=g('cultureOn').checked;
  if(g('followOn'))d.followOn=g('followOn').checked;
  if(document.querySelector('input[data-grp="culture"]'))d.culture=[];
  if(document.querySelector('input[data-grp="follow"]'))d.follow=[];
  document.querySelectorAll('input[data-grp]').forEach(function(c){
    if(!c.checked)return;var i=Number(c.dataset.i);
    if(c.dataset.grp==='culture')d.culture.push(CULTURE[i]);else d.follow.push(FOLLOW[i]);
  });
}
function firstMissing(){
  var d=S.draft,done=qDone(d);
  var lim=settings().step;for(var i=0;i<lim;i++)if(!done[i])return i+1;
  return 0;
}
var MSG={1:'Geser penunjuk pemahamanmu dan tulis alasannya.',2:'Tulis jawabanmu untuk pertanyaan 2.',3:'Pilih minimal satu kegiatan atau budaya.',4:'Tulis jawabanmu untuk pertanyaan 4.',5:'Pilih minimal satu rencana tindak lanjut.'};

document.addEventListener('focusout',function(){
  if(S.pendingRender&&S.view==='reflect'){S.pendingRender=false;setTimeout(function(){collectFromDom();render()},120)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(S.view==='reflect'){
    if(t.id==='p1'){
      S.draft.p1=Number(t.value);t.classList.remove('untouched');
      var pv=$('#p1val');if(pv)pv.textContent=t.value;
    }
    collectFromDom();updateProgress();
    var q=t.closest&&t.closest('.q');if(q)q.classList.remove('bad');
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(S.view==='reflect'){
    if(t.id==='cultureOn'){$('#cultureOtherWrap').style.display=t.checked?'block':'none';if(t.checked)$('#cultureOther').focus()}
    if(t.id==='followOn'){$('#followOtherWrap').style.display=t.checked?'block':'none';if(t.checked)$('#followOther').focus()}
    collectFromDom();updateProgress();
  }
  if(t.dataset&&t.dataset.filter){S.filter[t.dataset.filter]=t.value;render()}
  if(t.dataset&&t.dataset.dashkelas){S.dashKelas=t.value;render()}
  if(t.id==='totalIn'){
    var n=parseInt(t.value,10);
    if(n>0&&n<1000)setSettings({total:n}).then(function(){render();toast('Jumlah murid disimpan')});
    else{t.value=settings().total;toast('Masukkan angka yang valid')}
  }
});
document.addEventListener('keydown',function(e){
  if(S.view==='present'&&!S.modal){
    if(e.key==='ArrowRight'||e.key===' '){S.slide++;render();e.preventDefault()}
    else if(e.key==='ArrowLeft'){S.slide--;render();e.preventDefault()}
    else if(e.key==='Escape'){S.view='dash';render()}
  }else if(e.key==='Escape'&&S.modal){S.modal=null;renderModal()}
  else if(e.key==='Enter'){
    if(S.view==='identity'&&e.target.id==='nama')act('idNext');
    if(S.view==='login'&&e.target.id==='tcode')act('tLogin');
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='overlay'&&e.target!==el)return;
  act(el.dataset.act,el);
});

async function act(a,el){
  var id=el&&el.dataset?el.dataset.id:null;
  switch(a){
    case 'home':S.view='landing';render();window.scrollTo(0,0);break;
    case 'start':if(isLocked()){toast('Papan sedang dikunci oleh guru.');break}go('identity');break;
    case 'board':go('board');break;
    case 'teacherLogin':go(S.teacher?'dash':'login');break;
    case 'idNext':{
      var n=($('#nama').value||'').trim(),k=$('#kelas').value;
      if(!n){$('#idErr').textContent='Tulis namamu dulu ya.';$('#nama').focus();break}
      if(!k){$('#idErr').textContent='Pilih kelasmu dulu ya.';break}
      S.draft.nama=n;S.draft.kelas=k;go('reflect');break;
    }
    case 'toIdentity':collectFromDom();go('identity');break;
    case 'toReview':{
      collectFromDom();
      var m=firstMissing();
      if(m){
        document.querySelectorAll('.q').forEach(function(q){q.classList.remove('bad')});
        var q=$('#q'+m);q.classList.add('bad');q.scrollIntoView({behavior:'smooth',block:'center'});
        $('#refErr').textContent='Lengkapi dulu pertanyaan '+m+'. '+MSG[m];break;
      }
      go('review');break;
    }
    case 'editAnswers':go('reflect');break;
    case 'resend':S.sentStep=0;render();break;
    case 'sendPart':{
      collectFromDom();
      var mm=firstMissing();
      if(mm){
        document.querySelectorAll('.q').forEach(function(q){q.classList.remove('bad')});
        var qq=$('#q'+mm);qq.classList.add('bad');qq.scrollIntoView({behavior:'smooth',block:'center'});
        $('#refErr').textContent='Lengkapi dulu pertanyaan '+mm+'. '+MSG[mm];break;
      }
      var pr=draftToRec();if(!pr)break;
      S.myId=pr.id;
      var b2=el;if(b2){b2.disabled=true;b2.textContent='Mengirim…'}
      var okp=await saveRecord(pr);
      if(!okp){render();break}
      S.sentStep=settings().step;render();toast('Jawabanmu terkirim ✓');break;
    }
    case 'submit':{
      if(S.submitting)break;
      if(isLocked()){toast('Papan sedang dikunci oleh guru.');break}
      var rec=draftToRec();if(!rec){go('reflect');break}
      S.submitting=true;var b=$('#sendBtn');if(b){b.disabled=true;b.textContent='Mengirim…'}
      var shared=await saveRecord(rec);
      if(!shared){S.submitting=false;var b3=$('#sendBtn');if(b3){b3.disabled=false;b3.textContent='Kirim'}break}
      S.submitting=false;S.lastId=rec.id;S.lastCode=encCode(rec);S.lastShared=shared;
      S.draft=blankDraft(S.draft.nama,S.draft.kelas);S.myId=null;S.sentStep=0;
      go('thanks');break;
    }
    case 'copyCode':copyText(S.lastCode||'');break;
    case 'detail':S.modal={type:'detail',id:id};renderModal();break;
    case 'closeModal':case 'overlay':S.modal=null;renderModal();break;
    case 'del':
      S.modal={type:'confirm',title:'Hapus jawaban ini?',msg:'Jawaban ini akan dihapus dari papan dan tidak bisa dikembalikan.',onYes:async function(){await removeRec(id);toast('Jawaban dihapus')}};
      renderModal();break;
    case 'delAll':
      S.modal={type:'confirm',title:'Hapus semua respons?',msg:'Seluruh refleksi murid akan dihapus permanen dari papan. Ekspor CSV dulu jika datanya masih diperlukan.',onYes:async function(){
        var ids=allRecs().map(function(r){return r.id});
        for(var i=0;i<ids.length;i++)await removeRec(ids[i]);
        S.local=[];lsSet(LS_R,[]);S.lastId=null;toast('Semua respons dihapus');
      }};renderModal();break;
    case 'confirmYes':{
      var fn=S.modal&&S.modal.onYes;S.modal=null;renderModal();
      if(fn){await fn();render()}break;
    }
    case 'tLogin':{
      var c=($('#tcode').value||'').trim();
      if(!c){$('#tErr').textContent='Masukkan kode guru.';break}
      if(!S.auth){$('#tErr').textContent='Belum tersambung ke Firebase.';break}
      $('#tErr').textContent='Memeriksa…';
      try{await S.auth.signInWithEmailAndPassword(TEACHER_EMAIL,c);S.view='dash';render();window.scrollTo(0,0)}
      catch(err){$('#tErr').textContent=(err&&(err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/invalid-login-credentials'||err.code==='auth/user-not-found'))?'Kode belum tepat. Coba lagi.':'Gagal masuk. Periksa koneksi internet.'}
      break;
    }
    case 'tLogout':try{if(S.auth)await S.auth.signOut()}catch(err){}S.teacher=false;go('landing');break;
    case 'dash':go('dash');break;
    case 'lock':{
      var next=!settings().locked;
      await setSettings({locked:next});render();toast(next?'Papan dikunci':'Papan dibuka');break;
    }
    case 'openImport':S.modal={type:'import'};renderModal();break;
    case 'doImport':{
      var lines=($('#importTa').value||'').split(/\s+/).filter(Boolean);
      var have={};allRecs().forEach(function(r){have[r.id]=1});
      var ok=0,bad=0,dup=0;
      for(var i=0;i<lines.length;i++){
        var r=decCode(lines[i]);
        if(!r){bad++;continue}
        if(have[r.id]){dup++;continue}
        have[r.id]=1;await saveRecord(r);ok++;
      }
      if(!ok&&(bad||dup)){$('#impErr').textContent=bad?'Kode tidak dikenali. Pastikan salinannya utuh.':'Kode ini sudah pernah diimpor.';break}
      S.modal=null;renderModal();render();
      toast(ok+' refleksi diimpor'+(bad?' · '+bad+' kode tidak valid':'')+(dup?' · '+dup+' sudah ada':''));break;
    }
    case 'stepNext':{var c1=settings().step;if(c1<5){await setSettings({step:c1+1});S.viewQ=null;render();toast('Soal '+(c1+1)+' dibuka untuk murid')}break}
    case 'stepPrev':{var c2=settings().step;if(c2>1){await setSettings({step:c2-1});S.viewQ=null;render();toast('Kembali ke soal '+(c2-1))}break}
    case 'viewQ':S.viewQ=Number(el.dataset.q);render();break;
    case 'stepAll':await setSettings({step:5});S.viewQ=null;render();toast('Semua soal dibuka');break;
    case 'toggleReal':S.showReal=!S.showReal;render();break;
    case 'newSession':S.modal={type:'newsession'};renderModal();break;
    case 'confirmNew':{
      S.modal=null;renderModal();
      await clearAll();
      await setSettings({step:1,locked:false,session:Date.now()});
      S.draft=blankDraft();S.myId=null;S.sentStep=0;S.viewQ=null;S.seen={};S.lastCode=null;S.filter={kelas:'',cat:'',budaya:''};S.dashKelas='';S.slide=0;
      S.knownSession=settings().session;
      render();toast('Sesi baru dimulai. Papan kosong, soal kembali ke soal 1.');break;
    }
    case 'exportCsv':exportCsv();break;
    case 'present':S.slide=0;go('present');break;
    case 'exitPresent':go('dash');break;
    case 'prev':S.slide--;render();break;
    case 'next':S.slide++;render();break;
    case 'toggleNames':S.hideNames=!S.hideNames;render();break;
    case 'fullscreen':
      try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(err){toast('Layar penuh tidak tersedia di sini.')}
      break;
  }
}

/* ====== Inisialisasi ====== */
render();
(function(){
  if(typeof firebase==='undefined'){S.view='setup';S.setupMsg='cdn';render();return}
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.indexOf('ISI_')===0){S.view='setup';S.setupMsg='config';render();return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    S.db=firebase.firestore();S.auth=firebase.auth();S.canWrite=true;
    S.db.collection('reflections').onSnapshot(function(snap){
      S.shared=snap.docs.map(function(d){return clean(Object.assign({},d.data(),{id:d.id}))}).filter(Boolean);
      onData();
    },function(){toast('Koneksi ke database terputus.')});
    S.db.doc('settings/board').onSnapshot(function(sn){
      var d=sn.exists?sn.data():null;
      S.sharedSettings=d?{locked:!!d.locked,total:Number(d.total)||30,step:Number(d.step)||1,session:Number(d.session)||0}:{};
      onData();
    },function(){});
    S.auth.onAuthStateChanged(function(u){
      S.teacher=!!u&&String(u.email||'').toLowerCase()===TEACHER_EMAIL.toLowerCase();
      S.canEdit=S.teacher;
      if(S.unsubNames){S.unsubNames();S.unsubNames=null}
      if(S.teacher){
        S.unsubNames=S.db.collection('names').onSnapshot(function(snap){
          var m={};snap.docs.forEach(function(d){m[d.id]=str((d.data()||{}).nama,40)});S.names=m;onData();
        },function(){});
      }else{
        S.names={};
        if(S.view==='dash'||S.view==='present')S.view='landing';
      }
      var ae=document.activeElement;
      if(!(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')))render();
    });
  }catch(e){S.view='setup';S.setupMsg='config';render()}
})();
})();
</script>
